<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свадебное приглашение — Azamat & Leyla</title>
    <!-- Праздничные шрифты Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="invitation-card">

        <!-- Внешняя и внутренняя рамка -->
        <div class="border-outer">
            <div class="border-inner">

                <!-- Имена молодоженов -->
                <h1 class="names-header">AZAMAT & LEYLA</h1>

                <!-- Подзаголовок -->
                <div class="subtitle">ПРИГЛАШАЕМ ВАС</div>
                <div class="subtitle-sub">НА НАШЕ СВАДЕБНОЕ ТОРЖЕСТВО</div>

                <!-- Разделитель с сердечком -->
                <div class="divider">
                    <span class="divider-heart">♥</span>
                </div>

                <!-- Обращение к гостю -->
                <div class="guest-name">Дорогой(ая) <span id="guest-name">Гость</span>!</div>

                <!-- Текст приглашения -->
                <p class="invitation-text">
                    будем счастливы разделить с Вами радость нашего особенного дня.
                </p>

                <p class="waiting-text">
                    С нетерпением ждём встречи!
                </p>

                <!-- Разделитель -->
                <div class="divider">
                    <span class="divider-heart">♥</span>
                </div>

                <!-- Блок с информацией (Место, Дата, Время) -->
                <div class="info-block">
                    
                    <!-- МЕСТО -->
                    <div class="info-item">
                        <div class="info-label">
                            <svg class="info-icon" viewBox="0 0 24 24">
                                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                            </svg>
                            МЕСТО:
                        </div>
                        <div class="info-value">Душанбе</div>
                        <div class="info-value-sub">Restaurant Simin</div>
                    </div>

                    <div class="info-divider"></div>

                    <!-- ДАТА -->
                    <div class="info-item">
                        <div class="info-label">
                            <svg class="info-icon" viewBox="0 0 24 24">
                                <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/>
                            </svg>
                            ДАТА:
                        </div>
                        <div class="info-value">28.08.2026</div>
                    </div>

                    <div class="info-divider"></div>

                    <!-- ВРЕМЯ -->
                    <div class="info-item">
                        <div class="info-label">
                            <svg class="info-icon" viewBox="0 0 24 24">
                                <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                            </svg>
                            ВРЕМЯ:
                        </div>
                        <div class="info-value">19:00</div>
                    </div>

                </div>

                <!-- Разделитель -->
                <div class="divider" style="margin-top: 15px;"><span class="divider-heart">♥</span>
                </div>

                <!-- Завершение с каллиграфическим шрифтом -->
                <div class="signature-block">
                    <div class="with-love">С любовью,</div>
                    <div class="couple-signature">Azamat & Leyla</div>
                </div>

                <!-- Завитушка (орнамент снизу) -->
                <svg class="ornament-bottom" viewBox="0 0 100 20" fill="none" stroke="#b89759" stroke-width="1.2">
                    <path d="M10,10 Q25,0 40,10 T70,10 T90,10" fill="none"/>
                    <path d="M42,10 C45,15 48,17 50,17 C52,17 55,15 58,10" fill="none"/>
                    <path d="M46,8 C48,4 52,4 54,8" fill="none"/>
                </svg>

            </div>
        </div>
        <!-- Скрипт подстановки имени -->
    <script>
      const name = new URLSearchParams(window.location.search).get('name');
      if (name) {
        document.getElementById('guest-name').textContent = name;
      }
    </script>
    </div>

</body>
</html>
